version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://linkfree:linkfree@db:5432/linkfree?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=change-me-in-production
    depends_on:
      - db
    volumes:
      - app-uploads:/app/public/uploads

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=linkfree
      - POSTGRES_PASSWORD=linkfree
      - POSTGRES_DB=linkfree
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  app-uploads:
